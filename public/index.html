<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labcoder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#e9eef0;--panel:#fbfcfc;--ink:#13242b;--muted:#546a73;--line:#c5d0d5;--accent:#2442c8;--accent-ink:#fff;--ok:#0e7c66;--bad:#b3261e;--code-bg:#13242b;--code-ink:#e6eef1;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a1f;--panel:#16252c;--ink:#e4edf0;--muted:#93a8b1;--line:#2b4049;--accent:#7d93ff;--accent-ink:#0b1230;--ok:#4cc9a8;--bad:#ff8b80;--code-bg:#0a1317;--code-ink:#e6eef1}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}header{padding:20px 24px 0;max-width:1200px;margin:0 auto}h1{margin:0;font-size:1.6rem;font-weight:600;letter-spacing:-.01em}header p{margin:4px 0 0;color:var(--muted);max-width:60ch}main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;max-width:1200px;margin:20px auto;padding:0 24px 40px}@media (max-width:820px){main{grid-template-columns:1fr}}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}label{display:block;font-weight:500;margin:0 0 6px}select,textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}textarea{min-height:170px;resize:vertical}.field{margin-bottom:16px}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{font:inherit;font-weight:500;border-radius:6px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:100%;padding:11px}button:disabled{opacity:.55;cursor:not-allowed}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar input{flex:1;min-width:160px;font-family:var(--mono);font-size:.9rem}pre{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:16px;overflow:auto;max-height:62vh;font:400 .88rem/1.55 var(--mono);tab-size:4}.empty{color:var(--muted);padding:40px 8px;text-align:center}#status{min-height:1.5em;margin-top:12px;font-size:.95rem}#status.ok{color:var(--ok)}#status.err{color:var(--bad)}#status a{color:inherit}@media (prefers-reduced-motion:no-preference){button{transition:filter .12s}button:hover:not(:disabled){filter:brightness(1.07)}}
</style>
</head>
<body>
<header><h1>Labcoder</h1><p>Describe a task, pick a language, and get working code. Commit it to your lab’s GitHub repo in one click.</p></header>
<main>
<section class="panel" aria-label="Request"><div class="field"><label for="lang">Language</label><select id="lang"></select></div><div class="field"><label for="prompt">What should the code do?</label><textarea id="prompt" placeholder="Example: read a CSV of sensor readings, drop outliers beyond 3 standard deviations, and plot the cleaned series."></textarea></div><button class="primary" id="go">Generate code</button></section>
<section class="panel" aria-label="Result"><div id="empty" class="empty">Your generated code will appear here.</div><div id="result" class="hidden"><div class="bar"><input id="fname" aria-label="File name" spellcheck="false"><button id="copy">Copy</button><button id="dl">Download</button><button id="commit">Commit to GitHub</button></div><pre><code id="code"></code></pre></div><div id="status" role="status" aria-live="polite"></div></section>
</main>
<script>
const $=(id)=>document.getElementById(id);let current=null;
async function api(path,body){const res=await fetch(path,{method:body?"POST":"GET",headers:body?{"Content-Type":"application/json"}: {},body:body?JSON.stringify(body):undefined});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||"Request failed.");return data}
function setStatus(msg,kind=""){const s=$("status");s.className=kind;s.textContent=msg}
async function init(){try{const cfg=await api("/api/config");$("lang").innerHTML="";for(const l of cfg.languages)$("lang").add(new Option(l.label,l.id));$("commit").disabled=!cfg.githubEnabled;$("commit").title=cfg.githubEnabled?`Commits to ${cfg.repo}`:"Set GITHUB_TOKEN and GITHUB_REPO to enable"}catch(e){setStatus(e.message,"err")}}
$("go").addEventListener("click",async()=>{const prompt=$("prompt").value.trim();if(prompt.length<5)return setStatus("Describe the task in a sentence or two.","err");$("go").disabled=true;setStatus("Generating…");try{const r=await api("/api/generate",{language:$("lang").value,prompt});current=r;$("code").textContent=r.code;$("fname").value=r.filename;$("empty").classList.add("hidden");$("result").classList.remove("hidden");setStatus("Done. Review the code before you run or commit it.","ok")}catch(e){setStatus(e.message,"err")}finally{$("go").disabled=false}});
$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(current.code);setStatus("Copied to clipboard.","ok")}catch{setStatus("Copy failed. Select the code and copy it manually.","err")}});
$("dl").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([current.code],{type:"text/plain"}));a.download=$("fname").value||current.filename;a.click();URL.revokeObjectURL(a.href)});
$("commit").addEventListener("click",async()=>{$("commit").disabled=true;setStatus("Committing…");try{const r=await api("/api/commit",{language:current.language,filename:$("fname").value,code:current.code});const s=$("status");s.className="ok";s.textContent="Committed to ";const a=document.createElement("a");a.href=r.url;a.target="_blank";a.rel="noopener";a.textContent=r.path;s.append(a,".")}catch(e){setStatus(e.message,"err")}finally{$("commit").disabled=false}});
init();
</script>
</body>
</html>
